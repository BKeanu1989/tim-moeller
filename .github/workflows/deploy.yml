
name: Build and Deploy Astro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Hestia via FTPS
        uses: airvzxf/ftp-deployment-action@v2.11.14
        with:
          server: ftp://${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: ./dist/
          remote_dir: ${{ secrets.FTP_REMOTE_DIR }}
          ftp_ssl_allow: "true"
          ssl_verify_certificate: "true"
          delete: "false"